name: Sirnak WordPress Browser Bridge

on:
  push:
    paths:
      - '.github/workflows/sirnak-wp-browser.yml'
  workflow_dispatch:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: sirnak-wp-browser-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: GitHub OIDC token al
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=73haber-wp-bridge")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$JSON")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Bekleyen haberi al
        id: claim
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsSL \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            'https://www.73haber.com.tr/x.php?gha=claim')"
          printf '%s' "$RESPONSE" > "$RUNNER_TEMP/claim.json"

          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'claim.json')
          d=json.load(open(p,encoding='utf-8'))
          if not d.get('ok') or d.get('no_job'):
              print('has_job=false')
          else:
              print('has_job=true')
              print('job_id='+str(d['job_id']))
              print('prime_url='+str(d['prime_url']))
              print('browser_url='+str(d['browser_url']))
          PY

      - name: Kuyruk bos
        if: steps.claim.outputs.has_job != 'true'
        run: echo 'Bekleyen haber yok veya onceki is halen kilitli.'

      - name: Tek Chrome oturumunda WordPress'e gonder
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        env:
          PRIME_URL: ${{ steps.claim.outputs.prime_url }}
          BROWSER_URL: ${{ steps.claim.outputs.browser_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$BROWSER_URL"

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          XVFB_BIN="$(command -v Xvfb || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium runner uzerinde bulunamadi.' >&2
            exit 1
          fi
          if [ -z "$XVFB_BIN" ]; then
            echo 'Xvfb runner uzerinde bulunamadi.' >&2
            exit 1
          fi

          PROFILE="$RUNNER_TEMP/sirnak-chrome-profile"
          mkdir -p "$PROFILE"

          export DISPLAY=:99
          "$XVFB_BIN" :99 -screen 0 1280x800x24 -nolisten tcp \
            >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          XVFB_PID=$!

          cleanup() {
            if [ -n "${CHROME_PID:-}" ]; then kill "$CHROME_PID" 2>/dev/null || true; fi
            kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Chrome: $CHROME"
          echo '1/3 Ayni Chrome oturumu baslatiliyor...'
          "$CHROME" \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --disable-background-networking \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir="$PROFILE" \
            "$PRIME_URL" \
            >"$RUNNER_TEMP/chrome.out" 2>"$RUNNER_TEMP/chrome.err" &
          CHROME_PID=$!

          echo '2/3 Hosting JS/cookie dogrulamasi bekleniyor...'
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          sleep 22

          echo '3/3 Kopru AYNI Chrome oturumunda yeni sekmede aciliyor...'
          python3 <<'PY'
          import os, urllib.parse, urllib.request
          target = os.environ['BROWSER_URL']
          endpoint = 'http://127.0.0.1:9222/json/new?' + urllib.parse.quote(target, safe='')
          req = urllib.request.Request(endpoint, method='PUT')
          with urllib.request.urlopen(req, timeout=15) as r:
              print(r.read().decode('utf-8', errors='replace')[:1000])
          PY

          # iframe -> bot.php POST -> x.php ACK icin tarayiciyi acik tut.
          sleep 70

          echo 'Chrome oturumu tamamlandi.'

      - name: Sonucu kontrol et
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          JOB_ID: ${{ steps.claim.outputs.job_id }}
        run: |
          set -euo pipefail
          STATUS="$(curl -fsSL \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "https://www.73haber.com.tr/x.php?gha=status&job=${JOB_ID}")"
          echo "$STATUS"
          printf '%s' "$STATUS" > "$RUNNER_TEMP/status.json"

          python3 <<'PY'
          import json, os, sys
          p=os.path.join(os.environ['RUNNER_TEMP'],'status.json')
          d=json.load(open(p,encoding='utf-8'))
          status=str(d.get('status',''))
          if status in ('success','duplicate'):
              print('WordPress aktarimi basarili:', d.get('message',''))
              sys.exit(0)
          print('Aktarim tamamlanmadi:', status, d.get('message',''))
          sys.exit(1)
          PY

      - name: Basarisizlik tanilamasi
        if: failure() && steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          echo '--- chrome.err son 80 satir ---'
          tail -80 "$RUNNER_TEMP/chrome.err" 2>/dev/null || true
          echo '--- chrome.out son 40 satir ---'
          tail -40 "$RUNNER_TEMP/chrome.out" 2>/dev/null || true
          echo '--- xvfb.log son 40 satir ---'
          tail -40 "$RUNNER_TEMP/xvfb.log" 2>/dev/null || true

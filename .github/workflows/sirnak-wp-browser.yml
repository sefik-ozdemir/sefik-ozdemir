name: Sirnak WordPress Auto Import

on:
  push:
    paths:
      - '.github/workflows/sirnak-wp-browser.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: sirnak-wp-auto-import
  cancel-in-progress: false

jobs:
  auto-import:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: GitHub OIDC token al
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sirnak-ajans-wp-auto-import")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$JSON")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: WordPress otomatik aktarimi calistir
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          XVFB_BIN="$(command -v Xvfb || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium runner uzerinde bulunamadi.' >&2
            exit 1
          fi
          if [ -z "$XVFB_BIN" ]; then
            echo 'Xvfb runner uzerinde bulunamadi.' >&2
            exit 1
          fi

          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(python3 -c 'import uuid; print(uuid.uuid4())')"
          PROFILE="$RUNNER_TEMP/sirnak-wp-profile"
          TRIGGER_HTML="$RUNNER_TEMP/sa-trigger.html"
          export RUN_ID TRIGGER_HTML
          mkdir -p "$PROFILE"

          export DISPLAY=:99
          "$XVFB_BIN" :99 -screen 0 1280x800x24 -nolisten tcp >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          XVFB_PID=$!

          cleanup() {
            if [ -n "${CHROME_PID:-}" ]; then kill "$CHROME_PID" 2>/dev/null || true; fi
            kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          python3 <<'PY'
          import html, os
          token = os.environ['OIDC_TOKEN']
          run_id = os.environ['RUN_ID']
          path = os.environ['TRIGGER_HTML']
          body = f'''<!doctype html><html><head><meta charset="utf-8"><title>Şırnak Ajans tetikleniyor</title></head><body>
          <form id="f" method="post" action="https://sirnak.iblogger.org/?sa_gha_run=1">
            <input type="hidden" name="oidc_token" value="{html.escape(token, quote=True)}">
            <input type="hidden" name="run_id" value="{html.escape(run_id, quote=True)}">
          </form>
          <script>document.getElementById('f').submit();</script>
          </body></html>'''
          open(path, 'w', encoding='utf-8').write(body)
          PY

          echo "Chrome: $CHROME"
          echo '1/3 WordPress hosting dogrulamasi aciliyor...'
          "$CHROME" \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir="$PROFILE" \
            'https://sirnak.iblogger.org/' \
            >"$RUNNER_TEMP/chrome.out" 2>"$RUNNER_TEMP/chrome.err" &
          CHROME_PID=$!

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          sleep 22

          echo '2/3 Mevcut V5.2 otomatik aktarim motoru tetikleniyor...'
          FILE_URL="$(python3 - <<'PY'
          import os, pathlib
          print(pathlib.Path(os.environ['TRIGGER_HTML']).as_uri())
          PY
          )"
          export FILE_URL

          python3 <<'PY'
          import os, urllib.parse, urllib.request
          target = os.environ['FILE_URL']
          endpoint = 'http://127.0.0.1:9222/json/new?' + urllib.parse.quote(target, safe='')
          req = urllib.request.Request(endpoint, method='PUT')
          with urllib.request.urlopen(req, timeout=15) as r:
              r.read()
          PY

          echo '3/3 Sonuc bekleniyor...'
          python3 <<'PY'
          import json, os, sys, time, urllib.request

          run_id = os.environ['RUN_ID']
          deadline = time.time() + 150
          last_urls = []

          while time.time() < deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:9222/json', timeout=5) as r:
                      tabs = json.load(r)
                  urls = [str(t.get('url','')) for t in tabs if t.get('type') == 'page']
                  last_urls = urls
                  for url in urls:
                      if f'run={run_id}' not in url or 'sa_gha_result=' not in url:
                          continue
                      if 'sa_gha_result=success' in url:
                          print('WordPress aktarimi basarili.')
                          sys.exit(0)
                      if 'sa_gha_result=idle' in url:
                          print('Yeni haber yok; islem normal tamamlandi.')
                          sys.exit(0)
                      if 'sa_gha_result=busy' in url:
                          print('Aktarici mesgul; sonraki GitHub cron tekrar deneyecek.')
                          sys.exit(0)
                      if 'sa_gha_result=error' in url:
                          print('WordPress aktarimi hata ile dondu:', url)
                          sys.exit(1)
              except Exception as e:
                  print('Durum okunamadi, yeniden denenecek:', e)
              time.sleep(5)

          print('Zaman asimi. Son sekmeler:')
          for u in last_urls:
              print(u)
          sys.exit(1)
          PY

      - name: Hata tanilamasi
        if: failure()
        shell: bash
        run: |
          echo '--- Chrome hata kaydi ---'
          tail -100 "$RUNNER_TEMP/chrome.err" 2>/dev/null || true
          echo '--- Xvfb kaydi ---'
          tail -50 "$RUNNER_TEMP/xvfb.log" 2>/dev/null || true
